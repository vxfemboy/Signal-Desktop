# Tracks the LATEST stable upstream signalapp/Signal-Desktop release and builds
# the multi-account fork against it.
#
# Policy:
#   - Only the newest stable vX.Y.Z tag is considered (no -alpha/-beta).
#   - If a `<tag>-multiaccount` release already exists, the run is a silent
#     no-op (green, no notification).
#   - If the multi-account patch can't be applied (merge conflict) or the build
#     fails, an issue is filed and the run fails (intentional notification).
#   - If it builds cleanly, a `<tag>-multiaccount` release is published with the
#     Linux .deb + unpacked tarball. The release targets the fork branch, so no
#     workflow-file push is needed (the GITHUB_TOKEN can't push .github/workflows
#     changes, which is why build branches are NOT pushed).

name: Multi-account release

on:
  schedule:
    - cron: '0 13 * * *' # daily 13:00 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: 'Force a specific upstream stable tag (e.g. v8.14.0). Empty = newest stable.'
        required: false
        type: string
      force:
        description: 'Rebuild even if the release already exists.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

env:
  UPSTREAM_REPO: https://github.com/signalapp/Signal-Desktop.git
  # Pin every `gh` call to this fork (otherwise gh can resolve the upstream
  # remote and 403).
  GH_REPO: ${{ github.repository }}

jobs:
  discover:
    name: Discover latest stable tag
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.compute.outputs.build }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: |
          git remote add upstream "$UPSTREAM_REPO" || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch --quiet upstream --tags

      - name: Compute target
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          stable="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"

          if [ -n "${INPUT_TAG}" ]; then
            if ! printf '%s\n' "$stable" | grep -qx "${INPUT_TAG}"; then
              echo "::error::${INPUT_TAG} is not a known stable upstream tag"
              exit 1
            fi
            tag="${INPUT_TAG}"
          else
            tag="$(printf '%s\n' "$stable" | sort -V | tail -n1)"
          fi

          if [ -z "$tag" ]; then
            echo "No stable upstream tag found — nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Latest stable upstream tag: ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [ "${FORCE}" != "true" ] && gh release view "${tag}-multiaccount" >/dev/null 2>&1; then
            echo "Release ${tag}-multiaccount already exists — already current, nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ needs.discover.outputs.tag }}
    needs: discover
    if: needs.discover.outputs.build == 'true'
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ needs.discover.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream tag
        run: |
          git remote add upstream "$UPSTREAM_REPO" || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch --quiet upstream tag "$TAG"

      - name: Apply multi-account patch onto ${{ needs.discover.outputs.tag }}
        run: |
          set -euo pipefail
          base="$(git show origin/feature/multi-account:.github/multiaccount-base.txt | tr -d '[:space:]')"
          echo "Patch base: ${base}; target: ${TAG}"
          git checkout -B "build/${TAG}" "$TAG"
          if ! git cherry-pick "${base}..origin/feature/multi-account"; then
            git diff --name-only --diff-filter=U > "${RUNNER_TEMP}/conflicts.txt" || true
            git cherry-pick --abort || true
            echo 'conflict' > "${RUNNER_TEMP}/failure_reason"
            echo "::error::Merge conflict applying multi-account patch onto ${TAG}"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y xvfb libpulse0

      - name: Install dependencies
        env:
          NPM_CONFIG_NODE_GYP: echo
        run: pnpm install --frozen-lockfile

      - name: Generate assets
        run: pnpm run generate

      - name: Build Linux (.deb + unpacked dir)
        run: pnpm run build:release --linux deb dir --publish=never

      - name: Tests (best-effort, non-blocking)
        continue-on-error: true
        run: |
          xvfb-run --auto-servernum pnpm run test-node
          xvfb-run --auto-servernum pnpm run test-electron

      - name: Package unpacked dir
        run: tar -C release -czf "release/signal-desktop-multiaccount-${TAG}-linux-x64.tar.gz" linux-unpacked

      - name: Publish fork release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="Multi-account build on top of upstream signalapp/Signal-Desktop \`${TAG}\`.

          Linux x64 (glibc). Assets: Debian package + unpacked tarball.
          Built by the multi-account-release workflow."
          # Target the fork branch (already on the remote) so no workflow-file
          # push is required. Assets carry the actual built app. Idempotent:
          # update assets if the release already exists (e.g. force rebuild).
          assets=(release/*.deb "release/signal-desktop-multiaccount-${TAG}-linux-x64.tar.gz")
          if gh release view "${TAG}-multiaccount" >/dev/null 2>&1; then
            gh release upload "${TAG}-multiaccount" "${assets[@]}" --clobber
          else
            gh release create "${TAG}-multiaccount" \
              --title "Multi-account ${TAG}" \
              --notes "$notes" \
              --target feature/multi-account \
              "${assets[@]}"
          fi

      - name: Advance canonical branch to ${{ needs.discover.outputs.tag }}
        # Rebase feature/multi-account onto the just-built tag so the branch
        # source tracks upstream. Requires a PAT with `workflows` scope
        # (secret MULTIACCOUNT_PAT) because the GITHUB_TOKEN cannot push
        # .github/workflows changes. No PAT => skipped (release still stands).
        continue-on-error: true
        env:
          PAT: ${{ secrets.MULTIACCOUNT_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "MULTIACCOUNT_PAT not set — leaving branch on its current base." \
                 "Build branch HEAD already tracks ${TAG}; the canonical branch" \
                 "will only move when a PAT is configured or you advance locally."
            exit 0
          fi
          # We're on build/<TAG> = <TAG> + the multi-account patch. Record the
          # new base and move feature/multi-account to it. Skip the commit when
          # the base is unchanged (e.g. a forced rebuild of the current tag) so
          # the push still runs idempotently.
          printf '%s\n' "$TAG" > .github/multiaccount-base.txt
          git add .github/multiaccount-base.txt
          if git diff --cached --quiet; then
            echo "Base already ${TAG}; pushing branch unchanged."
          else
            git commit -m "chore: advance multi-account base to ${TAG}"
          fi
          git push --force "https://x-access-token:${PAT}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/feature/multi-account"

      - name: File an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          reason='build'
          detail="The build job for \`${TAG}\` failed before publishing a release. See the run logs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -f "${RUNNER_TEMP}/failure_reason" ] && grep -q conflict "${RUNNER_TEMP}/failure_reason"; then
            reason='conflict'
            files="$(cat "${RUNNER_TEMP}/conflicts.txt" 2>/dev/null || true)"
            detail=$'Applying the multi-account patch onto `'"${TAG}"$'` hit merge conflicts.\n\n**Conflicted files:**\n```\n'"${files}"$'\n```\n\nResolve locally and bump the patch base:\n```\ngit fetch upstream --tags\ngit rebase --onto '"${TAG}"' "$(cat .github/multiaccount-base.txt)" feature/multi-account\n# resolve conflicts, then:\nprintf "'"${TAG}"'\\n" > .github/multiaccount-base.txt\ngit add -A && git commit --amend --no-edit\ngit push --force-with-lease origin feature/multi-account\n```\nThen re-run this workflow.'
          fi
          title="Multi-account: ${reason} building ${TAG}"
          existing="$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number' || true)"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "$detail" --label multi-account 2>/dev/null \
              || gh issue create --title "$title" --body "$detail"
          else
            echo "Issue #${existing} already open for ${TAG}."
          fi
